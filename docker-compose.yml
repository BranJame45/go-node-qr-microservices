version: '3.8'

services:
  node-api:
    build: ./node-api
    container_name: node-api
    ports:
      - "3000:3000"
    environment:
      - NODE_PORT=3000
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  go-api:
    build: ./go-api
    container_name: go-api
    ports:
      - "8080:8080"
    environment:
      - GO_PORT=8080
      - NODE_API_URL=http://node-api:3000
      - JWT_SECRET=${JWT_SECRET}
      - DEMO_USER=${DEMO_USER}
      - DEMO_PASSWORD=${DEMO_PASSWORD}
    depends_on:
      node-api:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GO_API_URL=${VITE_GO_API_URL}
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - go-api
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
